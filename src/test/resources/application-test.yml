spring:
  datasource:
    url: jdbc:h2:mem:fiapx_video;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.zipkin.autoconfigure.ZipkinAutoConfiguration
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

fiapx:
  jwt:
    secret: fiapx-test-secret-key-with-at-least-32-bytes
    issuer: fiapx-auth
  storage:
    endpoint: http://localhost:8333
    access-key: test
    secret-key: test12345
    bucket: fiapx-videos-test
  outbox:
    intervalo-ms: 3600000
  notificacao:
    intervalo-ms: 3600000
  email:
    remetente: nao-responda@fiapx.com
    maximo-tentativas: 2

management:
  tracing:
    enabled: false
    export:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.fiapx: INFO
