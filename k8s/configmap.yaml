apiVersion: v1
kind: ConfigMap
metadata:
  name: video-service-config
  namespace: fiapx
data:
  DB_URL: jdbc:postgresql://postgres.fiapx.svc.cluster.local:5432/fiapx_video
  KAFKA_BOOTSTRAP_SERVERS: kafka.fiapx.svc.cluster.local:9092
  KAFKA_GROUP_ID: fiapx-video-group
  STORAGE_ENDPOINT: http://seaweedfs.fiapx.svc.cluster.local:8333
  STORAGE_BUCKET: fiapx-videos
  MAIL_HOST: mailhog.fiapx.svc.cluster.local
  MAIL_PORT: "1025"
  JWT_ISSUER: fiapx-auth
  ZIPKIN_ENDPOINT: http://zipkin.fiapx.svc.cluster.local:9411/api/v2/spans
  UPLOAD_MAX_FILE_SIZE: 500MB
  DB_POOL_SIZE: "10"
