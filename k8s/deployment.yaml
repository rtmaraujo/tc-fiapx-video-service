apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc-fiapx-video-service
  namespace: fiapx
  labels:
    app: tc-fiapx-video-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tc-fiapx-video-service
  template:
    metadata:
      labels:
        app: tc-fiapx-video-service
    spec:
      containers:
        - name: tc-fiapx-video-service
          image: ghcr.io/rtmaraujo/tc-fiapx-video-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: video-service-config
            - secretRef:
                name: video-service-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
